name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DEMO_MODE: "true"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rmit_study?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/rmit_study?schema=public"
          CANVAS_BASE_URL: "https://rmit.instructure.com"
          CANVAS_ALLOWED_HOSTS: "*.instructure.com"

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
